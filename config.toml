[app]
database_path = "data/parallax.db"
log_path = "data/parallax.log"
log_level = "INFO"

[http]
user_agent = "parallax/0.1 (+personal headline archive)"
connect_timeout_seconds = 5.0
read_timeout_seconds = 15.0
write_timeout_seconds = 10.0
pool_timeout_seconds = 5.0
max_connections = 10
max_keepalive_connections = 5
max_connections_per_host = 2
max_response_bytes = 2097152
follow_redirects = true
max_connect_attempts = 2
connect_retry_backoff_seconds = 0.5

[ingestion]
max_concurrent_sources = 8
retry_base_seconds = 30
retry_max_seconds = 1800

[scheduler]
loop_sleep_seconds = 2.0

[validation]
max_title_length = 1000
allow_empty_batches = false
max_future_seconds = 7200

# --- Native/direct sources -------------------------------------------------

[[sources]]
id = "thepaper-hot"
name = "澎湃新闻热榜"
region = "CN"
language = "zh-CN"
adapter = "thepaper_hot"
url = "https://cache.thepaper.cn/contentapi/wwwIndex/rightSidebar"
stream_kind = "hot"
item_kind = "article"
retrieval_method = "unofficial_web_json"
enabled = true
schedule_seconds = 1800

[sources.options]
max_items = 30

[[sources]]
id = "bloomberg-markets"
name = "Bloomberg - Markets"
region = "US"
language = "en-US"
adapter = "rss"
url = "https://feeds.bloomberg.com/markets/news.rss"
stream_kind = "latest"
item_kind = "article"
retrieval_method = "rss"
enabled = true
schedule_seconds = 900

[sources.options]
max_items = 100

[sources.redirect]
allowed_hosts = ["www.bloomberg.com"]

[[sources]]
