repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black --check
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        files: ^(src|tests)/
