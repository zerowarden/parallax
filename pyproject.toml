[project]
name = "parallax"
version = "0"
description = "Extensible headline collector with durable SQLite history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "flask>=3.1,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "selectolax>=0.4.11",
  "typer>=0.15,<1",
  "tzdata>=2026.4",
]

[project.scripts]
parallax = "parallax.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "pre-commit>=4,<5",
  "types-defusedxml>=0.7.0",
  "basedpyright>=1.40.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.ruff]
cache-dir = ".cache/ruff"
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
cache_dir = ".cache/mypy"
python_version = "3.12"
strict = true
packages = ["parallax"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
reportMissingParameterType = "error"
reportDeprecated = "error"

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
  "live: performs real upstream HTTP requests; excluded unless selected",
]

[tool.coverage.run]
data_file = ".cache/coverage"
branch = true
source = ["parallax"]

[tool.coverage.report]
show_missing = true
skip_covered = false
